// BORRADOR para revisión conjunta de R1 y R2. No es un contrato congelado.
// Conserva nombres y números de los campos del borrador del Módulo 2.
syntax = "proto3";
package impostor.v1;

service ImpostorEngine {
  rpc GenerateUtterance(UtteranceRequest) returns (stream UtteranceChunk);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

message UtteranceRequest {
  string room_id = 1;
  string persona_id = 2;
  string prompt = 3;
  repeated Message history = 4;
  GenerationConfig config = 5;
}

message Message {
  string alias = 1;
  string text = 2;
  int64 ts_ms = 3;
}

message GenerationConfig {
  float temperature = 1;
  float top_p = 2;
  int32 max_words = 3;
  string system_prompt_version = 4;
  // Extensión aditiva del plan operativo. Requiere revisión de R1/R2.
  string engine_backend = 5; // "hf-router" en la arquitectura actual
  string model_id = 6; // Modelo/proveedor solicitado; no prueba el proveedor efectivo
}

message UtteranceChunk {
  string text_delta = 1;
  bool is_final = 2;
  int32 token_index = 3;
}

// Definiciones que faltaban en el borrador del PDF; requieren revisión de R1.
message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string model_id = 2;
  string detail = 3;
}
