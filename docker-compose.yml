# SospechAI · docker compose
#
# Estado (viernes 18 sep): los tres servicios están operativos y se despliegan
# juntos — impostor-engine (gRPC 50051, solo red interna), impostor-orchestrator
# (HTTP 8080, solo red interna) y impostor-ui (Streamlit 8501, único puerto
# expuesto al host). Ya no hay pendientes R2/R3: la demo del 19 se apoya en
# este compose; el Plan B (tres terminales) sigue como alternativa.
#
# Uso:
#   docker compose up --build -d
#   docker compose ps
#   docker compose logs -f impostor-ui

services:
  impostor-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impostor-engine
    environment:
      HF_TOKEN: ${HF_TOKEN:?Definí HF_TOKEN en .env (ver .env.example)}
    networks:
      - sospechai-net
    restart: unless-stopped
    # SIN ports: el gRPC (50051) queda solo en la red interna, nunca sale
    # al host. La Inference API sale por la red normal del daemon.
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - 'import socket; socket.create_connection(("127.0.0.1", 50051), 2).close()'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  # Orquestador: servidor HTTP del juego (contrato UI-orquestador). No expone
  # puertos al host: la UI lo alcanza por el nombre de servicio interno.
  impostor-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: impostor-orchestrator
    command: uv run --no-sync python -m src.orchestrator.server --round-timeout 90
    depends_on:
      impostor-engine:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      SOSPECHAI_MODEL_ID: ${SOSPECHAI_MODEL_ID:?Definí SOSPECHAI_MODEL_ID en .env (ver .env.example)}
      SOSPECHAI_ENGINE_ADDR: impostor-engine:50051
      SOSPECHAI_EVENTS_DB: /app/data/game_events.sqlite3
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - sqlite-data:/app/data
    networks:
      - sospechai-net
    restart: unless-stopped

  # MLflow: UI de tracking en vivo para la sustentación M3. Puerto 5000
  # expuesto al host para mostrar params/métricas/artefactos/tags del run.
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: impostor-mlflow
    command: uv run --no-sync mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlruns/mlflow.db --artifacts-destination /app/mlruns/artifacts
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # El orquestador llama por el nombre de servicio interno "mlflow:5000":
      # autorizarlo como Host header válido junto con localhost/127.0.0.1.
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mlflow:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/app/mlruns
    networks:
      - sospechai-net
    restart: unless-stopped

  # UI: frontend Streamlit; único servicio con puerto expuesto al host.
  impostor-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: impostor-ui
    depends_on:
      - impostor-orchestrator
    environment:
      SOSPECHAI_UI_SOURCE: http
      SOSPECHAI_ORCHESTRATOR_URL: http://impostor-orchestrator:8080
    ports:
      - "8501:8501"   # ÚNICO puerto que se expone al host.
    networks:
      - sospechai-net
    restart: unless-stopped

networks:
  sospechai-net:
    driver: bridge

volumes:
  sqlite-data:
    # Persiste la base local del orquestador entre ciclos de contenedores.
  mlflow-data:
    # Persiste los runs de MLflow (backend + artefactos) entre ciclos.