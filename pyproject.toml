[project]
name = "sospechai"
version = "0.1.0"
description = "Inicio de R2 para el juego SospechAI"
requires-python = ">=3.13,<3.14"
dependencies = [
    "grpcio==1.83.1",
    "protobuf==7.36.1",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
  "black==26.5.1",
  "grpcio-tools==1.83.1",
  "pytest==9.1.1",
  "pytest-cov>=6,<8",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["error"]
markers = ["integration: integración por gRPC local; no usa servicios externos"]

[tool.ruff]
target-version = "py313"
line-length = 88
exclude = ["proto/*_pb2.py", "proto/*_pb2_grpc.py", "proto/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.black]
target-version = ["py313"]
extend-exclude = "proto/.*_pb2.*"
