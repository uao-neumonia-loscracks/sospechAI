name: sospechai

services:
  engine:
    image: ${CI_REGISTRY_IMAGE}/engine:${IMAGE_TAG}
    command: ["uv", "run", "--no-sync", "python", "-m", "src.impostor_engine.serve"]
    environment:
      HF_TOKEN: ${HF_TOKEN}
    restart: unless-stopped

  orchestrator:
    image: ${CI_REGISTRY_IMAGE}/orchestrator:${IMAGE_TAG}
    command: ["uv", "run", "--no-sync", "python", "-m", "src.orchestrator.server", "--round-timeout", "90"]
    environment:
      SOSPECHAI_ENGINE_ADDR: engine:50051
      SOSPECHAI_EVENTS_DB: /app/data/game_events.sqlite3
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SOSPECHAI_MODEL_ID: ${SOSPECHAI_MODEL_ID:-}
      SOSPECHAI_PROVIDER: ${SOSPECHAI_PROVIDER:-featherless-ai}
    volumes:
      - sqlite-data:/app/data
    depends_on: [engine, mlflow]
    restart: unless-stopped

  ui:
    image: ${CI_REGISTRY_IMAGE}/ui:${IMAGE_TAG}
    environment:
      SOSPECHAI_UI_SOURCE: http
      SOSPECHAI_ORCHESTRATOR_URL: http://orchestrator:8080
      APP_VERSION: ${IMAGE_TAG}
    ports:
      - "80:8501"
    depends_on: [orchestrator]
    restart: unless-stopped

  mlflow:
    image: ${CI_REGISTRY_IMAGE}/orchestrator:${IMAGE_TAG}
    command:
      - uv
      - run
      - --no-sync
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////app/mlruns/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/app/mlruns/artifacts
    environment:
      # El orquestador llama por el nombre interno "mlflow:5000": autorizarlo
      # como Host header válido (MLflow navegador/API rechaza hosts externos).
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:*,127.0.0.1:*,mlflow:*"
    volumes:
      - mlflow-data:/app/mlruns
    ports:
      - "127.0.0.1:5000:5000"
    restart: unless-stopped

volumes:
  sqlite-data:
  mlflow-data: